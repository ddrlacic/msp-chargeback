<div
  role="tablist"
  class="-mx-4 -my-2 flex snap-x scroll-px-4 gap-2 overflow-x-auto px-4 py-2 [scrollbar-width:none] sm:-mx-6 sm:scroll-px-6 sm:gap-3 sm:px-6"
  [attr.aria-label]="label"
>
  @for (item of items(); track item.tab; let index = $index) {
    <button
      #tab
      type="button"
      role="tab"
      class="flex min-w-44 flex-1 snap-start flex-col items-start gap-0.5 rounded-md bg-white p-4 text-left transition-[box-shadow] duration-200 ease-in-out"
      [class]="item.tab === active() ? 'shadow-tile-selected' : 'shadow-tile hover:shadow-tile-hover'"
      [id]="getTabId(item.tab)"
      [attr.aria-selected]="item.tab === active()"
      [attr.aria-controls]="panelId()"
      [tabIndex]="item.tab === active() ? 0 : -1"
      [attr.data-tab]="item.tab"
      (click)="activeChange.emit(item.tab)"
      (keydown)="onKeydown($event, index)"
    >
      <span class="max-w-full truncate text-ink-muted"
        >{{ item.label }}@if (item.dueSoon; as dueSoon) {
          • <span class="font-semibold text-needs-action-text" data-due-soon>{{ dueSoon }}</span>
        }</span
      >
      <span class="text-h1 font-bold tracking-[-0.5px] text-ink tabular-nums" data-count>{{
        item.count
      }}</span>
      <span class="max-w-full truncate text-ink-muted tabular-nums" data-detail>{{
        item.detail
      }}</span>
    </button>
  }
</div>
