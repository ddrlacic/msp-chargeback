<div class="relative flex w-full min-w-0 items-center sm:w-88">
  <span class="pointer-events-none absolute left-3 text-ink-subtle" aria-hidden="true">
    <lucide-icon
      name="search"
      class="block size-4"
      [size]="16"
      [strokeWidth]="1.5"
      [absoluteStrokeWidth]="true"
    />
  </span>
  <input
    #search
    type="search"
    class="h-control w-full min-w-0 appearance-none rounded-md bg-white pr-10 pl-9 text-ink shadow-field transition-[box-shadow] duration-200 ease-in-out placeholder:text-ink-muted hover:shadow-field-hover [&::-webkit-search-cancel-button]:appearance-none"
    autocomplete="off"
    [attr.aria-label]="copy.SEARCH.LABEL"
    [placeholder]="copy.SEARCH.PLACEHOLDER"
    [value]="filters().search"
    (input)="onSearch($event)"
  />
  @if (filters().search) {
    <button
      type="button"
      class="absolute right-2 grid size-6 place-items-center rounded-sm text-ink-subtle transition-[background-color,color] duration-200 ease-in-out after:absolute after:-inset-2 hover:bg-hover hover:text-ink"
      [attr.aria-label]="copy.SEARCH.CLEAR"
      (click)="clearSearch(search)"
    >
      <lucide-icon
        name="x"
        class="block size-4"
        [size]="16"
        [strokeWidth]="1.5"
        [absoluteStrokeWidth]="true"
        aria-hidden="true"
      />
    </button>
  }
</div>

<app-filter-menu
  [label]="copy.FILTERS.RECEIVED"
  [options]="receivedOptions"
  [selected]="[filters().received]"
  [valueLabel]="receivedValue()"
  (selectedChange)="onReceived($event)"
/>
<app-filter-menu
  multiple
  [label]="copy.FILTERS.LOCATION"
  [options]="locationOptions()"
  [selected]="filters().merchantIds"
  [valueLabel]="locationValue()"
  (selectedChange)="onLocations($event)"
/>
<app-filter-menu
  multiple
  [label]="copy.FILTERS.NETWORK"
  [options]="networkOptions"
  [selected]="filters().networks"
  [valueLabel]="networkValue()"
  (selectedChange)="onNetworks($event)"
/>
