<app-page [title]="copy.TITLE">
  <div class="flex min-h-full flex-col gap-4 sm:gap-6">
    <app-chargeback-tabs
      [tabs]="tabSummaries()"
      [dueSoon]="dueSoon()"
      [currency]="currency()"
      [active]="tab()"
      [panelId]="panelId"
      (activeChange)="onTabChange($event)"
    />

    <div class="flex flex-col gap-2">
      <div class="flex flex-wrap items-center gap-2">
        <app-chargeback-filters
          [filters]="filters()"
          [locations]="locations()"
          (filtersChange)="onFiltersChange($event)"
        />
        <button
          type="button"
          class="group relative inline-flex h-control shrink-0 items-center gap-1 rounded-md bg-white px-3 font-semibold whitespace-nowrap text-ink-strong shadow-control transition-[background-color,box-shadow,scale] duration-200 ease-in-out after:absolute after:inset-x-0 after:-inset-y-0.5 enabled:hover:bg-canvas enabled:hover:shadow-control-hover enabled:active:scale-[0.96] disabled:cursor-not-allowed disabled:text-ink-placeholder disabled:shadow-field motion-reduce:active:scale-100 pointer-coarse:after:-inset-y-1"
          [disabled]="!rows().length"
          (click)="exportCases()"
        >
          <lucide-icon
            name="download"
            class="block size-4 text-ink-subtle group-disabled:text-ink-placeholder"
            [size]="16"
            [strokeWidth]="1.5"
            [absoluteStrokeWidth]="true"
            aria-hidden="true"
          />
          {{ exportLabel() }}
        </button>
      </div>

      @if (filterChips().length) {
        <app-filter-chips
          [chips]="filterChips()"
          (remove)="removeFilter($event)"
          (clearAll)="clearAllFilters()"
        />
      }
    </div>

    <app-chargeback-table
      role="tabpanel"
      [id]="panelId"
      [attr.aria-labelledby]="tabId()"
      [rows]="rows()"
      [sort]="sort()"
      [selectedIds]="selectedIds()"
      [columnWidths]="columnWidths()"
      (sortChange)="onSortChange($event)"
      (selectionChange)="selectedIds.set($event)"
      (columnResize)="onColumnResize($event)"
      (rowOpen)="openCase($event)"
    >
      <div class="flex flex-1 flex-col items-center justify-center px-4 py-12 text-center">
        <lucide-icon
          [name]="emptyState().icon"
          class="block size-10 text-ink-subtle"
          [size]="40"
          [strokeWidth]="1.5"
          [absoluteStrokeWidth]="true"
          aria-hidden="true"
        />
        <h2 class="mt-4 text-h3">{{ emptyState().title }}</h2>
        @if (emptyState().message; as message) {
          <p class="mt-1.5 max-w-sm text-pretty text-ink-muted">{{ message }}</p>
        }
        @if (emptyState().canClear) {
          <button
            type="button"
            class="relative mt-4 inline-flex h-control items-center rounded-md bg-white px-3 font-semibold text-ink-strong shadow-control transition-[background-color,box-shadow,scale] duration-200 ease-in-out after:absolute after:inset-x-0 after:-inset-y-0.5 hover:bg-canvas hover:shadow-control-hover active:scale-[0.96] motion-reduce:active:scale-100 pointer-coarse:after:-inset-y-1"
            (click)="clearFilters()"
          >
            {{ copy.FILTERS.CLEAR }}
          </button>
        }
      </div>
    </app-chargeback-table>
  </div>
</app-page>
