<time
  class="flex tabular-nums"
  [class]="layout() === 'inline' ? 'items-center gap-1 whitespace-nowrap' : 'flex-col'"
  [attr.datetime]="date()"
>
  <span class="text-body text-ink">{{ info().dateLabel }}&#32;</span>
  @if (layout() === 'inline') {
    <span class="text-body text-ink-muted" aria-hidden="true">·&#32;</span>
  }
  <span [class]="toneClass()">{{ info().remainingLabel }}</span>
</time>
