<time
  class="flex tabular-nums"
  [class]="layout() === 'inline' ? 'items-baseline gap-2 whitespace-nowrap' : 'flex-col'"
  [attr.datetime]="date()"
>
  <span class="text-body text-ink">{{ info().dateLabel }}</span>
  <span class="flex items-center gap-1 text-small" [class]="toneClass()">
    @switch (info().tone) {
      @case ('soon') {
        <lucide-icon name="clock" class="size-3 shrink-0" aria-hidden="true" />
      }
      @case ('overdue') {
        <lucide-icon name="circle-alert" class="size-3 shrink-0" aria-hidden="true" />
      }
    }
    {{ info().remainingLabel }}
  </span>
</time>
