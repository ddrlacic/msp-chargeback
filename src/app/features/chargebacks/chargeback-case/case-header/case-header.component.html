<div class="flex flex-wrap items-center gap-x-3 gap-y-1">
  <p class="text-h1 font-bold text-ink tabular-nums">
    <span class="sr-only">{{ copy.AMOUNT }}</span>
    {{ header().amount }}
  </p>
  <app-chargeback-status-badge [status]="chargeback().status" />
</div>
<p class="mt-1 text-pretty text-ink">{{ header().reason }}</p>
<ul class="mt-1 flex flex-wrap items-center gap-x-2 text-ink-muted tabular-nums">
  <li class="inline-flex items-center gap-2">
    <span aria-hidden="true">{{ header().card }}</span>
    <span class="sr-only">{{ header().cardLabel }}</span>
  </li>
  <li class="inline-flex items-center gap-2">
    <span class="text-ink-placeholder" aria-hidden="true">·</span>{{ header().order }}
  </li>
  <li class="inline-flex min-w-0 items-center gap-2">
    <span class="text-ink-placeholder" aria-hidden="true">·</span>{{ header().location }}
  </li>
</ul>
