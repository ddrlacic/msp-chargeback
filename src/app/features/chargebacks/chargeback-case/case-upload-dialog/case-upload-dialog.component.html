<app-dialog [open]="open()" [title]="copy.TITLE" [width]="480" (closed)="close()">
  <div class="mt-4 flex flex-col gap-4">
    <div class="flex flex-col gap-1">
      <label class="font-semibold text-ink" [for]="typeId">{{ copy.TYPE }}</label>
      <div class="relative flex items-center">
        <select
          class="h-control w-full min-w-0 appearance-none rounded-md bg-white pr-9 pl-3 text-ink shadow-field transition-[box-shadow] duration-200 ease-in-out hover:shadow-field-hover"
          required
          [id]="typeId"
          (change)="onType($event)"
        >
          <option value="" disabled [selected]="type() === ''">{{ copy.TYPE_PLACEHOLDER }}</option>
          @for (option of typeOptions; track option.value) {
            <option [value]="option.value" [selected]="type() === option.value">
              {{ option.label }}
            </option>
          }
        </select>
        <span class="pointer-events-none absolute right-3 text-ink-subtle" aria-hidden="true">
          <lucide-icon
            name="chevron-down"
            class="block size-4"
            [size]="16"
            [strokeWidth]="1.5"
            [absoluteStrokeWidth]="true"
          />
        </span>
      </div>
    </div>

    <div
      class="flex flex-col items-center rounded-md border border-dashed px-4 py-6 text-center transition-[background-color,border-color] duration-200 ease-in-out"
      [class]="dragging() ? 'border-accent-80 bg-accent-05' : 'border-line-strong bg-white'"
      [attr.data-dragging]="dragging() ? '' : null"
      (dragenter)="onDragOver($event)"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)"
      (drop)="onDrop($event)"
    >
      <lucide-icon
        name="upload"
        class="block size-6 text-ink-subtle"
        [size]="24"
        [strokeWidth]="1.5"
        [absoluteStrokeWidth]="true"
        aria-hidden="true"
      />
      <p class="mt-2 text-pretty text-ink">
        {{ copy.DROP }}
        <button
          type="button"
          class="relative rounded-sm text-brand-primary underline-offset-2 after:absolute after:-inset-x-2 after:-inset-y-2 hover:underline"
          (click)="picker.click()"
        >
          {{ copy.CHOOSE }}
        </button>
      </p>
      <p class="mt-1 text-small text-ink-muted">{{ hint() }}</p>
      <input #picker type="file" multiple hidden [accept]="accept" (change)="onPick($event)" />
    </div>

    @if (errors().length) {
      <ul class="flex flex-col gap-1" role="alert">
        @for (error of errors(); track error) {
          <li class="flex items-start gap-1 text-small text-lost-text">
            <span class="flex h-lh shrink-0 items-center" aria-hidden="true">
              <lucide-icon
                name="circle-alert"
                class="block size-3"
                [size]="12"
                [strokeWidth]="1"
                [absoluteStrokeWidth]="true"
              />
            </span>
            {{ error }}
          </li>
        }
      </ul>
    }

    @if (fileRows().length) {
      <ul class="flex flex-col rounded-md border border-line" [attr.aria-label]="copy.FILES">
        @for (row of fileRows(); track row.file) {
          <li
            class="flex min-w-0 items-center gap-3 border-b border-line py-1 pr-1 pl-3 last:border-b-0"
          >
            <lucide-icon
              name="file-text"
              class="block size-4 shrink-0 text-ink-subtle"
              [size]="16"
              [strokeWidth]="1.5"
              [absoluteStrokeWidth]="true"
              aria-hidden="true"
            />
            <span class="min-w-0 flex-1 truncate" [title]="row.file.name">{{ row.file.name }}</span>
            <span class="shrink-0 text-small text-ink-muted tabular-nums">{{ row.size }}</span>
            <button
              type="button"
              appButton="icon"
              [attr.aria-label]="copy.REMOVE(row.file.name)"
              (click)="removeFile(row.file)"
            >
              <lucide-icon
                name="x"
                class="block size-4"
                [size]="16"
                [strokeWidth]="1.5"
                [absoluteStrokeWidth]="true"
                aria-hidden="true"
              />
            </button>
          </li>
        }
      </ul>
    }
  </div>

  <button type="button" dialogActions appButton="secondary" (click)="close()">
    {{ copy.CANCEL }}
  </button>
  <button
    type="button"
    dialogActions
    appButton="primary"
    [disabled]="!canSubmit()"
    (click)="submit()"
  >
    {{ submitLabel() }}
  </button>
</app-dialog>
