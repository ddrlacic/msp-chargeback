<section [attr.aria-labelledby]="titleId">
  <h2 class="border-b border-line pb-3 text-h3" [id]="titleId">{{ copy.TITLE }}</h2>

  <ul [attr.aria-label]="copy.LIST">
    @for (row of rows(); track row.document.id) {
      <li
        class="flex items-center gap-3 border-b border-line py-3 last:border-b-0"
        [attr.data-document]="row.document.id"
      >
        <span class="shrink-0 self-start pt-0.5 text-ink-subtle" aria-hidden="true">
          <lucide-icon
            class="block size-5"
            [name]="row.icon"
            [size]="20"
            [strokeWidth]="1.5"
            [absoluteStrokeWidth]="true"
          />
        </span>
        <div class="min-w-0 flex-1">
          @if (row.canOpen) {
            <button
              type="button"
              class="relative flex max-w-full rounded-xs text-left text-ink underline-offset-2 after:absolute after:inset-x-0 after:-inset-y-[9px] hover:underline pointer-coarse:after:-inset-y-[11px]"
              [attr.aria-label]="copy.PREVIEW(row.document.name)"
              (click)="preview(row.document)"
            >
              <span class="truncate" [title]="row.document.name">{{ row.document.name }}</span>
            </button>
          } @else {
            <span class="block truncate text-ink" [title]="row.document.name">{{
              row.document.name
            }}</span>
          }
          <p class="text-small text-pretty text-ink-muted tabular-nums">
            {{ row.typeLabel }} · {{ row.size }} · {{ row.dateLabel }}
          </p>
          @if (row.status; as status) {
            <p
              class="mt-0.5 flex items-center gap-1 text-small"
              [class]="status.tone === 'error' ? 'font-semibold text-lost-text' : 'text-ink-muted'"
              [attr.data-status]="row.document.securityStatus"
            >
              <span
                class="block shrink-0"
                [class]="status.tone === 'scanning' ? 'motion-safe:animate-spin' : ''"
                aria-hidden="true"
              >
                <lucide-icon
                  class="block size-3"
                  [name]="status.tone === 'scanning' ? 'loader-circle' : 'circle-alert'"
                  [size]="12"
                  [strokeWidth]="1.5"
                  [absoluteStrokeWidth]="true"
                />
              </span>
              {{ status.label }}
            </p>
          }
        </div>
        <button
          type="button"
          class="shrink-0"
          appButton="icon"
          [disabled]="!row.canOpen"
          [attr.aria-label]="copy.DOWNLOAD(row.document.name)"
          [title]="copy.DOWNLOAD(row.document.name)"
          (click)="download(row.document)"
        >
          <lucide-icon
            name="download"
            class="block size-4"
            [size]="16"
            [strokeWidth]="1.5"
            [absoluteStrokeWidth]="true"
            aria-hidden="true"
          />
        </button>
      </li>
    }
  </ul>
</section>
