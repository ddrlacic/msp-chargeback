<app-page [title]="title()" [breadcrumbs]="breadcrumbs()">
  @if (chargeback(); as chargeback) {
    <div class="@container">
      <div
        class="flex flex-col gap-6 @4xl:grid @4xl:grid-cols-[minmax(0,1fr)_20rem] @4xl:grid-rows-[auto_auto_1fr] @4xl:gap-x-8"
      >
        <app-case-header class="@4xl:col-span-2" [chargeback]="chargeback" />

        <app-case-status-banner
          class="@4xl:col-start-1"
          [chargeback]="chargeback"
          (action)="onAction($event)"
        />

        <div
          class="contents @4xl:col-start-2 @4xl:row-span-2 @4xl:row-start-2 @4xl:flex @4xl:flex-col @4xl:gap-6 @4xl:self-start"
        >
          @if (deadline(); as deadline) {
            <app-case-deadline class="order-1 @4xl:order-none" [deadline]="deadline" />
          }
          <app-case-money class="order-3 @4xl:order-none" [chargeback]="chargeback" />
          <app-case-details class="order-4 @4xl:order-none" [chargeback]="chargeback" />
        </div>

        <app-case-timeline
          class="order-2 @4xl:order-none @4xl:col-start-1 @4xl:self-start"
          [chargeback]="chargeback"
          (action)="onAction($event)"
        />
      </div>
    </div>
    <app-case-accept-dialog
      [open]="acceptOpen()"
      [amount]="acceptAmount()"
      (closed)="acceptOpen.set(false)"
      (confirmed)="acceptChargeback()"
    />
    <app-case-arbitration-dialog
      [open]="arbitrationOpen()"
      [chargeback]="chargeback"
      (closed)="arbitrationOpen.set(false)"
      (confirmed)="requestArbitration()"
    />
  } @else {
    <div class="flex flex-col items-center px-4 py-16 text-center">
      <p class="text-pretty text-ink-muted">{{ copy.NOT_FOUND_MESSAGE }}</p>
      <a
        class="relative mt-6 inline-flex h-control items-center rounded-md bg-white px-3 font-semibold text-ink-strong shadow-control transition-[background-color,box-shadow] duration-200 ease-in-out after:absolute after:inset-x-0 after:-inset-y-0.5 hover:bg-canvas hover:shadow-control-hover pointer-coarse:after:-inset-y-1"
        [routerLink]="chargebacksPath"
      >
        {{ copy.BACK_TO_LIST }}
      </a>
    </div>
  }
</app-page>
