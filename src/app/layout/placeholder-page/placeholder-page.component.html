<app-page [title]="pageTitle()">
  <div class="flex flex-col items-center px-4 py-16 text-center">
    <span
      class="grid size-12 place-items-center rounded-full bg-accent-05 text-brand-primary"
      aria-hidden="true"
    >
      <lucide-icon name="construction" class="size-6" [strokeWidth]="1.5" />
    </span>
    <h2 class="mt-4 text-h3">{{ copy.HEADING }}</h2>
    <p class="mt-1 text-pretty text-ink-muted">{{ copy.MESSAGE }}</p>
    <a
      class="relative mt-6 inline-flex h-[34px] items-center rounded-sm bg-brand-primary px-3 font-semibold text-white shadow-button-primary transition-[background-color,scale] duration-200 ease-in-out after:absolute after:inset-x-0 after:-inset-y-[3px] hover:bg-brand-primary-hover active:scale-[0.96] pointer-coarse:after:-inset-y-[5px]"
      [routerLink]="chargebacksPath"
    >
      {{ copy.ACTION }}
    </a>
  </div>
</app-page>
