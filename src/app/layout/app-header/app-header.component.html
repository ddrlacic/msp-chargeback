<header
  class="fixed inset-x-0 top-0 z-30 flex h-[60px] items-center justify-between gap-2 bg-white px-4 shadow-header max-sm:px-2"
>
  <div class="flex min-w-0 items-center gap-2">
    <button
      type="button"
      class="relative grid size-control shrink-0 place-items-center rounded-md text-grayscale-80 transition-[background-color] duration-200 ease-in-out after:absolute after:top-1/2 after:left-1/2 after:size-10 after:-translate-1/2 hover:bg-hover active:bg-pressed pointer-coarse:after:size-11"
      [attr.aria-label]="layout.sidebarOpen() ? copy.CLOSE_MENU : copy.OPEN_MENU"
      [attr.aria-expanded]="layout.sidebarOpen()"
      aria-controls="app-sidebar"
      (click)="layout.toggleSidebar()"
    >
      <lucide-icon
        name="menu"
        class="block"
        [size]="24"
        [strokeWidth]="1.5"
        [absoluteStrokeWidth]="true"
        aria-hidden="true"
      />
    </button>
    <img src="par-logo.svg" width="54" height="48" class="shrink-0" [alt]="copy.LOGO_ALT" />
    <p class="min-w-0 truncate px-1 text-h3 font-semibold tracking-[-0.408px] text-grayscale-80">
      {{ copy.PRODUCT_NAME }}
    </p>
  </div>

  <div class="flex shrink-0 items-center gap-2 pointer-coarse:gap-2.5">
    <button type="button" appButton="invisible-simple" [attr.popovertarget]="scenarioPanelId">
      {{ copy.SCENARIOS }}
    </button>
    <button
      type="button"
      popovertarget="notifications-menu"
      class="relative grid size-control place-items-center rounded-md text-grayscale-80 transition-[background-color] duration-200 ease-in-out after:absolute after:top-1/2 after:left-1/2 after:size-10 after:-translate-1/2 hover:bg-hover active:bg-pressed pointer-coarse:after:size-11"
      [attr.aria-label]="copy.NOTIFICATIONS"
    >
      <lucide-icon
        name="bell"
        class="block"
        [size]="24"
        [strokeWidth]="1.5"
        [absoluteStrokeWidth]="true"
        aria-hidden="true"
      />
    </button>
    <button
      type="button"
      popovertarget="user-menu"
      class="relative grid size-control place-items-center rounded-md text-grayscale-80 transition-[background-color] duration-200 ease-in-out after:absolute after:top-1/2 after:left-1/2 after:size-10 after:-translate-1/2 hover:bg-hover active:bg-pressed pointer-coarse:after:size-11"
      [attr.aria-label]="copy.USER_MENU"
    >
      <lucide-icon
        name="user"
        class="block"
        [size]="24"
        [strokeWidth]="1.5"
        [absoluteStrokeWidth]="true"
        aria-hidden="true"
      />
    </button>
  </div>
</header>

<div
  id="notifications-menu"
  popover
  class="inset-auto top-16 right-4 m-0 w-[min(360px,calc(100vw-16px))] rounded-md border-0 bg-white p-0 shadow-menu max-sm:right-2"
>
  <p class="border-b border-divider px-4 py-3 font-semibold">{{ copy.NOTIFICATIONS }}</p>
  <p class="px-4 py-6 text-center text-ink-muted">{{ copy.NO_NOTIFICATIONS }}</p>
</div>

<div
  id="user-menu"
  popover
  #userMenu
  class="inset-auto top-16 right-4 m-0 w-[min(260px,calc(100vw-16px))] rounded-md border-0 bg-white p-0 shadow-menu max-sm:right-2"
>
  <div class="border-b border-divider px-4 py-3">
    <p class="truncate font-semibold" [attr.title]="copy.USER_NAME">{{ copy.USER_NAME }}</p>
    <p class="truncate text-small text-ink-muted" [attr.title]="copy.USER_EMAIL">
      {{ copy.USER_EMAIL }}
    </p>
  </div>
  <ul class="py-1">
    <li>
      <button
        type="button"
        class="flex min-h-10 w-full items-center gap-3 px-4 py-1.5 text-left transition-[background-color] duration-200 ease-in-out hover:bg-hover focus-visible:-outline-offset-2 pointer-coarse:min-h-11"
        (click)="userMenu.hidePopover()"
      >
        <lucide-icon
          name="user"
          class="size-4 text-grayscale-80"
          [size]="16"
          [strokeWidth]="1.5"
          [absoluteStrokeWidth]="true"
          aria-hidden="true"
        />
        {{ copy.PROFILE }}
      </button>
    </li>
    <li>
      <button
        type="button"
        class="flex min-h-10 w-full items-center gap-3 px-4 py-1.5 text-left transition-[background-color] duration-200 ease-in-out hover:bg-hover focus-visible:-outline-offset-2 pointer-coarse:min-h-11"
        (click)="userMenu.hidePopover()"
      >
        <lucide-icon
          name="log-out"
          class="size-4 text-grayscale-80"
          [size]="16"
          [strokeWidth]="1.5"
          [absoluteStrokeWidth]="true"
          aria-hidden="true"
        />
        {{ copy.SIGN_OUT }}
      </button>
    </li>
  </ul>
</div>
