<input
  type="checkbox"
  class="peer col-start-1 row-start-1 m-0 size-4 cursor-pointer appearance-none rounded-sm border border-line-strong bg-white transition-[background-color,border-color] duration-150 ease-in-out checked:border-brand-primary checked:bg-brand-primary indeterminate:border-brand-primary indeterminate:bg-brand-primary hover:border-grayscale-40 hover:checked:border-brand-primary hover:indeterminate:border-brand-primary motion-reduce:transition-none"
  [checked]="checked()"
  [indeterminate]="indeterminate()"
  [attr.aria-label]="ariaLabel()"
  [tabIndex]="tabIndex()"
  (change)="onChange($event)"
/>
<span
  class="pointer-events-none col-start-1 row-start-1 hidden text-white peer-checked:block peer-indeterminate:hidden"
  aria-hidden="true"
>
  <lucide-icon name="check" class="block size-3" [strokeWidth]="3" />
</span>
<span
  class="pointer-events-none col-start-1 row-start-1 hidden text-white peer-indeterminate:block"
  aria-hidden="true"
>
  <lucide-icon name="minus" class="block size-3" [strokeWidth]="3" />
</span>
