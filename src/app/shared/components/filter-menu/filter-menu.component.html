<button
  #trigger
  type="button"
  class="relative inline-flex h-[34px] max-w-full items-center gap-2 rounded-sm border bg-white pr-2 pl-2.5 whitespace-nowrap shadow-button-secondary transition-[background-color,border-color] duration-200 ease-in-out after:absolute after:inset-x-0 after:-inset-y-[3px] pointer-coarse:after:-inset-y-[5px]"
  [class]="
    active()
      ? 'border-brand-primary text-ink hover:bg-accent-05'
      : 'border-line-strong text-ink-strong hover:border-grayscale-40'
  "
  [attr.aria-label]="accessibleName()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="id"
  (click)="toggle()"
>
  <span>{{ label() }}</span>
  @if (valueLabel(); as value) {
    <span class="h-4 w-px shrink-0 bg-line-strong" aria-hidden="true"></span>
    <span class="truncate font-semibold text-brand-primary">{{ value }}</span>
  }
  <span
    class="size-4 shrink-0 text-ink-subtle transition-[rotate] duration-180 ease-in-out motion-reduce:transition-none"
    [class.rotate-180]="open()"
    aria-hidden="true"
  >
    <lucide-icon name="chevron-down" class="block size-4" />
  </span>
</button>

<div
  #panel
  role="group"
  class="absolute top-full z-40 mt-1 w-max max-w-[min(20rem,calc(100vw-1rem))] min-w-56 rounded-sm bg-white py-1 shadow-menu transition-[opacity,translate,visibility] ease-out-strong motion-reduce:translate-y-0"
  [class]="
    (open()
      ? 'visible translate-y-0 opacity-100 duration-150'
      : 'invisible -translate-y-0.5 opacity-0 duration-100') + (alignEnd() ? ' right-0' : ' left-0')
  "
  [id]="id"
  [attr.aria-label]="label()"
>
  @for (option of options(); track option.value) {
    @if (multiple()) {
      <label
        class="flex h-10 cursor-pointer items-center gap-3 px-3 transition-[background-color] duration-200 ease-in-out hover:bg-canvas pointer-coarse:h-11"
      >
        <app-checkbox
          [checked]="isSelected(option.value)"
          (checkedChange)="toggleValue(option.value, $event)"
        />
        <span class="min-w-0 flex-1 truncate">{{ option.label }}</span>
        @if (option.description) {
          <span class="shrink-0 text-small text-ink-muted tabular-nums">{{
            option.description
          }}</span>
        }
      </label>
    } @else {
      <label
        class="flex h-10 cursor-pointer items-center gap-3 px-3 transition-[background-color] duration-200 ease-in-out hover:bg-canvas has-focus-visible:outline-2 has-focus-visible:-outline-offset-2 has-focus-visible:outline-brand-primary pointer-coarse:h-11"
        (click)="onOptionClick($event)"
      >
        <input
          type="radio"
          class="peer sr-only"
          [name]="id"
          [value]="option.value"
          [checked]="isSelected(option.value)"
          (change)="selectValue(option.value)"
        />
        <span
          class="invisible size-4 shrink-0 text-ink-strong peer-checked:visible"
          aria-hidden="true"
        >
          <lucide-icon name="check" class="block size-4" [strokeWidth]="2" />
        </span>
        <span class="min-w-0 flex-1 truncate peer-checked:font-semibold">{{ option.label }}</span>
      </label>
    }
  }
</div>
