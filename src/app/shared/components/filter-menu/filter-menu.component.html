<button
  #trigger
  type="button"
  class="relative inline-flex h-control max-w-full items-center gap-1 rounded-md bg-white px-3 font-semibold whitespace-nowrap transition-[background-color,box-shadow] duration-200 ease-in-out after:absolute after:inset-x-0 after:-inset-y-0.5 pointer-coarse:after:-inset-y-1"
  [class]="
    active()
      ? 'text-brand-primary shadow-control-selected hover:bg-accent-05 active:bg-accent-15'
      : 'text-ink-strong shadow-control hover:bg-canvas hover:shadow-control-hover'
  "
  [attr.aria-label]="accessibleName()"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="id"
  [attr.data-active]="active() ? '' : null"
  (click)="toggle()"
>
  <span class="truncate">{{ label() }}</span>
  <span
    class="size-4 shrink-0 transition-[rotate] duration-180 ease-in-out motion-reduce:transition-none"
    [class.rotate-180]="open()"
    [class.text-ink-subtle]="!active()"
    aria-hidden="true"
  >
    <lucide-icon
      name="chevron-down"
      class="block size-4"
      [size]="16"
      [strokeWidth]="1.5"
      [absoluteStrokeWidth]="true"
    />
  </span>
</button>

<div
  #panel
  role="group"
  class="absolute top-full z-40 mt-1 flex w-max max-w-[min(20rem,calc(100vw-1rem))] min-w-56 flex-col overflow-hidden rounded-md bg-white shadow-menu transition-[opacity,translate,visibility] ease-out-strong motion-reduce:translate-y-0"
  [class]="
    (open()
      ? 'visible translate-y-0 opacity-100 duration-150'
      : 'invisible -translate-y-0.5 opacity-0 duration-100') + (alignEnd() ? ' right-0' : ' left-0')
  "
  [id]="id"
  [attr.aria-label]="label()"
>
  <div class="max-h-80 overflow-y-auto py-1">
    @for (option of options(); track option.value) {
      @if (multiple()) {
        <label
          class="flex h-10 items-center gap-3 px-3 transition-[background-color] duration-200 ease-in-out hover:bg-canvas pointer-coarse:h-11"
        >
          <app-checkbox
            [checked]="isSelected(option.value)"
            (checkedChange)="toggleValue(option.value, $event)"
          />
          <span class="min-w-0 flex-1 truncate">{{ option.label }}</span>
          @if (option.description) {
            <span class="shrink-0 text-small text-ink-muted tabular-nums">{{
              option.description
            }}</span>
          }
        </label>
      } @else {
        <label
          class="flex h-10 items-center gap-3 px-3 transition-[background-color] duration-200 ease-in-out hover:bg-canvas has-focus-visible:outline-2 has-focus-visible:-outline-offset-2 has-focus-visible:outline-brand-primary pointer-coarse:h-11"
          (click)="onOptionClick($event)"
        >
          <input
            type="radio"
            class="peer sr-only"
            [name]="id"
            [value]="option.value"
            [checked]="isSelected(option.value)"
            (change)="selectValue(option.value)"
          />
          <span
            class="invisible size-4 shrink-0 text-ink-strong peer-checked:visible"
            aria-hidden="true"
          >
            <lucide-icon
              name="check"
              class="block size-4"
              [size]="16"
              [strokeWidth]="1.5"
              [absoluteStrokeWidth]="true"
            />
          </span>
          <span class="min-w-0 flex-1 truncate peer-checked:font-semibold">{{
            option.label
          }}</span>
        </label>
      }
    }
  </div>

  @if (multiple()) {
    <div class="flex items-center justify-between gap-4 border-t border-divider px-3 py-2">
      <button
        type="button"
        class="relative rounded-sm text-brand-primary underline-offset-2 transition-[color] duration-200 ease-in-out after:absolute after:-inset-x-2 after:-inset-y-2 enabled:hover:underline disabled:cursor-not-allowed disabled:text-ink-placeholder"
        [disabled]="!selected().length"
        (click)="clearValues()"
      >
        {{ copy.CLEAR }}
      </button>
      <button
        type="button"
        class="relative rounded-sm text-brand-primary underline-offset-2 transition-[color] duration-200 ease-in-out after:absolute after:-inset-x-2 after:-inset-y-2 enabled:hover:underline disabled:cursor-not-allowed disabled:text-ink-placeholder"
        [disabled]="allSelected()"
        (click)="selectAllValues()"
      >
        {{ copy.SELECT_ALL }}
      </button>
    </div>
  }
</div>
