<dialog
  #dialog
  class="m-auto max-h-[calc(100dvh-2rem)] max-w-[calc(100vw-2rem)] overflow-y-auto overscroll-contain rounded-md bg-white p-5 shadow-menu sm:p-6"
  [style.width.px]="width()"
  [attr.aria-labelledby]="titleId"
  [attr.aria-describedby]="description() ? descriptionId : null"
  (close)="onClose()"
>
  <h2 class="text-h3" [id]="titleId">{{ title() }}</h2>
  @if (description(); as text) {
    <p class="mt-1.5 text-pretty text-ink-strong" [id]="descriptionId">{{ text }}</p>
  }
  <ng-content />
  <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
    <ng-content select="[dialogActions]" />
  </div>
</dialog>
